" stroke="#b3122b" stroke-width="2"/><rect x="303" y="233" width="14" height="14" fill="#7d0c1e"/><rect x="203" y="253" width="14" height="14" fill="#7d0c1e"/><rect x="224" y="254" width="12" height="12" fill="none" stroke="#b3122b" stroke-width="2"/><rect x="244" y="254" width="12" height="12" fill="none" stroke="#b3122b" stroke-width="2"/><rect x="264" y="254" width="12" height="12" fill="none" stroke="#b3122b" stroke-width="2"/><rect x="283" y="253" width="14" height="14" fill="#7d0c1e"/><rect x="223" y="273" width="14" height="14" fill="#7d0c1e"/><rect x="244" y="274" width="12" height="12" fill="none" stroke="#b3122b" stroke-width="2"/><rect x="263" y="273" width="14" height="14" fill="#7d0c1e"/><rect x="243" y="293" width="14" height="14" fill="#7d0c1e"/><path d="M233.0,54 L247.0,54 L240.0,67 z" fill="#2f5d8a"/><path d="M24,203.0 L24,217.0 L37,210.0 z" fill="#2f5d8a"/><text x="470" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#2f5d8a" text-anchor="start" font-weight="700">1. Центр</text><text x="470" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">трикутники на краях вказують середину</text><text x="470" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">схеми — починайте звідти</text><text x="470" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#1a1714" text-anchor="start" font-weight="700">2. Товсті лінії</text><text x="470" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">ділять сітку на квадрати 10×10 —</text><text x="470" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">так легше рахувати</text><text x="470" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#7d0c1e" text-anchor="start" font-weight="700">3. Символ = колір</text><text x="470" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">кожен значок відповідає нитці</text><text x="470" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">з легенди під схемою</text><text x="470" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" fill="#6b6058" text-anchor="start" font-weight="700">4. Порожня клітинка</text><text x="470" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">не вишивається — там лишається</text><text x="470" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">тканина</text><text x="40" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#1a1714" text-anchor="start" font-weight="700">Легенда:</text><rect x="110" y="366" width="16" height="16" fill="#7d0c1e"/><text x="134" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">DMC 815 — контур, 24 хр.</text><rect x="330" y="366" width="16" height="16" fill="none" stroke="#b3122b" stroke-width="2"/><text x="354" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">DMC 321 — заливка, 46 хр.</text></svg>
