<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Схема: як вишити хрестик — ряд напівхрестиків і повернення"><title>Схема: як вишити хрестик — ряд напівхрестиків і повернення</title><rect width="760" height="310" fill="#fff"/><defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3122b"/></marker><marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1714"/></marker><marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6058"/></marker></defs><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="17" fill="#1a1714" text-anchor="start" font-weight="700">Як вишити хрестик: спершу ряд напівхрестиків, потім — назад</text><text x="20" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">1. Ряд «/» зліва направо</text><text x="275" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">2. Назад: стібки «\»</text><text x="530" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">3. Верхні стібки — в один бік</text><rect x="20" y="90" width="176" height="132" fill="#faf7f2" stroke="#e6dccd"/><circle cx="20" cy="90" r="2.6" fill="#cfc3b2"/><circle cx="20" cy="134" r="2.6" fill="#cfc3b2"/><circle cx="20" cy="178" r="2.6" fill="#cfc