<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Плетіння бісером навхрест на дві голки: перший хрестик, наступний хрестик, ланцюжок"><title>Плетіння бісером навхрест на дві голки: перший хрестик, наступний хрестик, ланцюжок</title><rect width="760" height="310" fill="#fff"/><defs><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3122b"/></marker><marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1714"/></marker><marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6058"/></marker></defs><text x="20" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="17" fill="#1a1714" text-anchor="start" font-weight="700">Плетіння «навхрест» на дві голки: кожен хрестик — 4 бісерини</text><text x="20" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">1. Перший хрестик</text><path d="M188.0,143.0 L150.0,165.0 L120.0,135.0 L90.0,165.0" fill="none" stroke="#b3122b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M90.0,165.0 L120.0,195.0 L150.0,165.0 L188.0,187.0" fill="none" stroke="#2f5d8a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aB)"/><circle cx="188" cy="143" r="3.5" fill="#b3122b"/><circle cx="90.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="90.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="120.0" cy="135.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="120.0" cy="135.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="120.0" cy="195.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="120.0" cy="195.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="150.0" cy="165.0" r="11" fill="#fff4d6" stroke="#9c8b77" stroke-width="1.5"/><circle cx="150.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><text x="20" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">Наберіть 4 бісерини на середину</text><text x="20" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">нитки, кінець пропустіть крізь 4-ту</text><text x="20" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">назустріч — вийде кільце.</text><text x="255" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">2. Наступний хрестик</text><path d="M340.0,165.0 L370.0,135.0 L400.0,165.0 L438.0,143.0" fill="none" stroke="#b3122b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aR)"/><path d="M340.0,165.0 L370.0,195.0 L400.0,165.0 L438.0,187.0" fill="none" stroke="#2f5d8a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aB)"/><circle cx="280.0" cy="165.0" r="11" fill="#e8e1d6" stroke="#b8ab9a" stroke-width="1.5"/><circle cx="280.0" cy="165.0" r="3" fill="#b8ab9a" opacity=".45"/><circle cx="310.0" cy="135.0" r="11" fill="#e8e1d6" stroke="#b8ab9a" stroke-width="1.5"/><circle cx="310.0" cy="135.0" r="3" fill="#b8ab9a" opacity=".45"/><circle cx="310.0" cy="195.0" r="11" fill="#e8e1d6" stroke="#b8ab9a" stroke-width="1.5"/><circle cx="310.0" cy="195.0" r="3" fill="#b8ab9a" opacity=".45"/><circle cx="340.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="340.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="370.0" cy="135.0" r="11" fill="#fde0e4" stroke="#9c8b77" stroke-width="1.5"/><circle cx="370.0" cy="135.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="370.0" cy="195.0" r="11" fill="#dde8f3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="370.0" cy="195.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="400.0" cy="165.0" r="11" fill="#fff4d6" stroke="#9c8b77" stroke-width="1.5"/><circle cx="400.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><text x="255" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">Обидва кінці виходять зі спільної бісерини;</text><text x="255" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">на кожен — по 1 бісерині, далі одна (жовта)</text><text x="255" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">на один кінець, другий — крізь неї назустріч.</text><text x="530" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#7d0c1e" text-anchor="start" font-weight="600">3. Ланцюжок</text><circle cx="545.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="545.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="575.0" cy="135.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="575.0" cy="135.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="575.0" cy="195.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="575.0" cy="195.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="605.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="605.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="635.0" cy="135.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="635.0" cy="135.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="635.0" cy="195.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="635.0" cy="195.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="665.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="665.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="695.0" cy="135.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="695.0" cy="135.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="695.0" cy="195.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="695.0" cy="195.0" r="3" fill="#9c8b77" opacity=".45"/><circle cx="725.0" cy="165.0" r="11" fill="#f1e6d3" stroke="#9c8b77" stroke-width="1.5"/><circle cx="725.0" cy="165.0" r="3" fill="#9c8b77" opacity=".45"/><text x="530" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">Хрестики з'єднуються спільною</text><text x="530" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">бісериною — виходить ажурна</text><text x="530" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" fill="#6b6058" text-anchor="start" font-weight="400">стрічка для силянки чи браслета.</text></svg>
